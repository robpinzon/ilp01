<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <!-- Terracotta Gradient -->
    <linearGradient id="brandTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E56A44"/>
      <stop offset="50%" stop-color="#C85A32"/>
      <stop offset="100%" stop-color="#9E3C1A"/>
    </linearGradient>

    <!-- Deep Forest Gradient -->
    <linearGradient id="brandForest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E4D3B"/>
      <stop offset="100%" stop-color="#123326"/>
    </linearGradient>

    <!-- Golden Sun Gradient -->
    <linearGradient id="brandSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Modern Emblem Mark (Left: 70x70) -->
  <g transform="translate(10, 10)">
    <!-- Rounded Squircle Badge -->
    <rect width="70" height="70" rx="20" fill="url(#brandForest)"/>
    <rect x="1.5" y="1.5" width="67" height="67" rx="18.5" fill="none" stroke="#E5A93C" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- Rising Sun over Arayat Peaks -->
    <circle cx="35" cy="26" r="11" fill="url(#brandSun)"/>

    <!-- Mount Arayat Peak Silhouette (Twin Peaks) -->
    <path d="M 8 56 L 25 30 L 32 40 L 41 26 L 62 56 Z" fill="#FAF8F5"/>
    <!-- Subtle Mountain Shadow Layer -->
    <path d="M 25 30 L 32 40 L 41 26 L 62 56 L 35 56 Z" fill="#E6DFD5" opacity="0.6"/>

    <!-- Terracotta Heart Emblem -->
    <path d="M 35 44 C 33.5 40.5 28.5 40.5 28.5 44.5 C 28.5 48.5 35 53 35 53 C 35 53 41.5 48.5 41.5 44.5 C 41.5 40.5 36.5 40.5 35 44 Z" 
          fill="url(#brandTerracotta)"/>
  </g>

  <!-- Modern Typography (Right: X=95) -->
  <g transform="translate(96, 20)">
    <!-- Brand Title: I Love Pampanga -->
    <text x="0" y="32" 
          font-family="'Playfair Display', Georgia, serif" 
          font-size="30" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="#1E4D3B">
      I Love <tspan fill="#C85A32">Pampanga</tspan>
    </text>

    <!-- Brand Tagline -->
    <text x="1" y="52" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="9.5" 
          font-weight="700" 
          letter-spacing="2" 
          fill="#78716C" 
          text-transform="uppercase">
      Culinary &amp; Heritage Capital of the Philippines
    </text>
  </g>
</svg>
